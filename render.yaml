services:
  - type: web
    name: jazamart
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jazamart-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: AUTO_INIT_DB
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: PUBLIC_SITE_URL
        value: https://jazamart.onrender.com
      - key: FRONTEND_URL
        value: https://jazamart.onrender.com
      - key: MPESA_ENV
        value: sandbox
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        value: "174379"
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_CALLBACK_URL
        value: https://jazamart.onrender.com/api/mpesa/callback
      - key: MPESA_ACCOUNT_REFERENCE
        value: JazaMart
      - key: MPESA_TRANSACTION_DESC
        value: JazaMart order payment
      - key: MPESA_TRANSACTION_TYPE
        value: CustomerPayBillOnline

databases:
  - name: jazamart-db
    plan: free
    region: singapore
