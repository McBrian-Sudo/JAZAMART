services:
  - type: web
    name: jazamart
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jazamart-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: AUTO_INIT_DB
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production

databases:
  - name: jazamart-db
    plan: free
    region: singapore
